<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고양이 점프 멀티플레이</title>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --sky-color: #a2d2ff;
            --grass-color: #57cc99;
            --cat-color: #ffb703;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-info {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #fff;
            border-radius: 10px 10px 0 0;
            font-weight: bold;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            height: 400px;
            background-color: var(--sky-color);
            position: relative;
            overflow: hidden;
            border-bottom: 50px solid var(--grass-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* 내 고양이 */
        .cat {
            width: 50px;
            height: 50px;
            position: absolute;
            bottom: 0;
            font-size: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transform: scaleX(-1);
            transition: bottom 0.05s linear;
        }

        .cat-name {
            position: absolute;
            top: -25px;
            font-size: 12px;
            background: rgba(255,255,255,0.7);
            padding: 2px 5px;
            border-radius: 4px;
            white-space: nowrap;
            transform: scaleX(-1);
        }

        /* 다른 플레이어 고양이 */
        .other-cat {
            opacity: 0.6;
            z-index: 5;
        }

        /* 장애물 */
        .obstacle {
            width: 40px;
            height: 40px;
            position: absolute;
            bottom: 0;
            right: -50px;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
        }

        /* 리더보드 */
        #leaderboard {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 30;
            width: 150px;
        }

        #leaderboard h3 { border-bottom: 1px solid #ccc; margin-bottom: 5px; font-size: 14px; }

        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: block; /* 초기 상태를 보임으로 변경 */
            z-index: 100;
        }

        #restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: var(--cat-color);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .jump {
            animation: jumpAnimation 0.5s ease-out;
        }

        @keyframes jumpAnimation {
            0% { bottom: 0; }
            50% { bottom: 120px; }
            100% { bottom: 0; }
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            animation: moveClouds linear infinite;
        }

        @keyframes moveClouds {
            from { right: -150px; }
            to { right: 100%; }
        }
    </style>
</head>
<body>

<div id="game-info">
    <div id="player-id">연결 중...</div>
    <div id="score">내 점수: 0</div>
</div>

<div id="game-container">
    <div id="leaderboard">
        <h3>실시간 순위</h3>
        <div id="rank-list">대기 중...</div>
    </div>
    
    <div id="message-box">
        <h2 id="msg-title">고양이 점프!</h2>
        <p id="msg-content">로딩 중입니다... 잠시만 기다려주세요.</p>
        <button id="restart-btn" disabled>로딩 중</button>
    </div>
</div>

<script>
    // --- 설정 및 데이터 초기화 ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-jump-multi-v2';
    let db, auth;
    
    try {
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();
    } catch (e) {
        console.error("Firebase 초기화 오류:", e);
    }

    const container = document.getElementById('game-container');
    const scoreElement = document.getElementById('score');
    const messageBox = document.getElementById('message-box');
    const restartBtn = document.getElementById('restart-btn');
    const rankList = document.getElementById('rank-list');
    const playerIdDisplay = document.getElementById('player-id');
    const msgContent = document.getElementById('msg-content');

    let myId = 'local-' + Math.random().toString(36).substr(2, 9);
    let myName = "플레이어_" + Math.floor(Math.random() * 1000);
    let score = 0;
    let isJumping = false;
    let isGameOver = true;
    let obstacleTimeout;
    let myCatElement = null;

    // --- 멀티플레이어 동기화 ---
    async function startMultiplayer() {
        if (!auth || !db) {
            msgContent.textContent = "오프라인 모드로 실행됩니다.";
            enableStartButton();
            return;
        }

        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await auth.signInWithCustomToken(__initial_auth_token);
            } else {
                await auth.signInAnonymously();
            }

            myId = auth.currentUser.uid;
            playerIdDisplay.textContent = `이름: ${myName}`;
            msgContent.textContent = "다함께 점프!";
            enableStartButton();

            // 내 캐릭터 생성 (시작 전 미리 생성)
            if (!myCatElement) myCatElement = createCatElement(myId, myName, true);
            
            // 다른 플레이어 실시간 감시
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('players')
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        const data = change.doc.data();
                        const id = change.doc.id;
                        if (id === myId) return;

                        if (change.type === "added" || change.type === "modified") {
                            updateOtherPlayer(id, data);
                        } else if (change.type === "removed") {
                            removeOtherPlayer(id);
                        }
                    });
                    updateLeaderboard(snapshot.docs);
                }, (err) => console.error("Snapshot error:", err));

        } catch (error) {
            console.error("인증 실패:", error);
            msgContent.textContent = "멀티플레이 연결 실패. 오프라인 모드 진행.";
            enableStartButton();
        }

        window.onbeforeunload = () => {
            if (myId && db) {
                db.collection('artifacts').doc(appId).collection('public').doc('data').collection('players').doc(myId).delete();
            }
        };
    }

    function enableStartButton() {
        restartBtn.disabled = false;
        restartBtn.textContent = "게임 시작";
        if (!myCatElement) myCatElement = createCatElement(myId, myName, true);
    }

    function createCatElement(id, name, isMe) {
        const div = document.createElement('div');
        div.className = isMe ? 'cat' : 'cat other-cat';
        div.id = `cat-${id}`;
        div.innerHTML = `<span class="cat-name">${name}</span><span class="emoji">🐈</span>`;
        div.style.left = isMe ? '50px' : (Math.random() * 200 + 100) + 'px';
        div.style.bottom = '0px';
        container.appendChild(div);
        return div;
    }

    function updateOtherPlayer(id, data) {
        let el = document.getElementById(`cat-${id}`);
        if (!el) {
            el = createCatElement(id, data.name || "친구", false);
        }
        el.style.bottom = data.y + 'px';
        const emojiEl = el.querySelector('.emoji');
        if (emojiEl) {
            emojiEl.textContent = data.isJumping ? '🙀' : (data.isGameOver ? '😵' : '🐈');
        }
    }

    function removeOtherPlayer(id) {
        const el = document.getElementById(`cat-${id}`);
        if (el) el.remove();
    }

    function updateLeaderboard(docs) {
        const players = docs.map(d => ({id: d.id, ...d.data()}));
        players.sort((a, b) => (b.score || 0) - (a.score || 0));
        
        rankList.innerHTML = players.slice(0, 5).map((p, index) => 
            `<div>${index + 1}. ${p.id === myId ? '<b>나</b>' : (p.name || '알수없음').substring(0,6)}: ${p.score || 0}</div>`
        ).join('');
    }

    async function syncMyState(y, jumping, gameOver) {
        if (!myId || !db) return;
        try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('players').doc(myId).set({
                name: myName,
                y: y,
                isJumping: jumping,
                isGameOver: gameOver,
                score: score,
                lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        } catch (e) {
            console.error("동기화 실패");
        }
    }

    // --- 게임 로직 ---
    function initGame() {
        score = 0;
        scoreElement.textContent = `내 점수: ${score}`;
        isGameOver = false;
        messageBox.style.display = 'none';
        
        document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
        if (myCatElement) {
            myCatElement.querySelector('.emoji').textContent = '🐈';
            myCatElement.style.bottom = '0px';
        }
        syncMyState(0, false, false);
        spawnObstacle();
    }

    function jump() {
        if (isGameOver || isJumping) return;
        
        isJumping = true;
        myCatElement.classList.add('jump');
        myCatElement.querySelector('.emoji').textContent = '🙀';
        
        syncMyState(120, true, false);

        setTimeout(() => {
            myCatElement.classList.remove('jump');
            isJumping = false;
            if (!isGameOver) {
                myCatElement.querySelector('.emoji').textContent = '🐈';
                syncMyState(0, false, false);
            }
        }, 500);
    }

    function spawnObstacle() {
        if (isGameOver) return;

        const obstacle = document.createElement('div');
        obstacle.classList.add('obstacle');
        const types = ['🐕', '🐍', '🌵', '🪨', '📦'];
        obstacle.textContent = types[Math.floor(Math.random() * types.length)];
        container.appendChild(obstacle);

        let obstaclePos = 800;
        const moveSpeed = 6 + (score * 0.1); 

        const moveObstacle = setInterval(() => {
            if (isGameOver) {
                clearInterval(moveObstacle);
                return;
            }

            obstaclePos -= moveSpeed;
            obstacle.style.left = obstaclePos + 'px';

            const catRect = myCatElement.getBoundingClientRect();
            const obsRect = obstacle.getBoundingClientRect();

            if (
                catRect.right > obsRect.left + 15 &&
                catRect.left < obsRect.right - 15 &&
                catRect.bottom > obsRect.top + 15
            ) {
                gameOver();
                clearInterval(moveObstacle);
            }

            if (obstaclePos < -50) {
                clearInterval(moveObstacle);
                obstacle.remove();
                score++;
                scoreElement.textContent = `내 점수: ${score}`;
                syncMyState(0, false, false);
            }
        }, 20);

        obstacleTimeout = setTimeout(spawnObstacle, Math.random() * 1200 + 800);
    }

    function gameOver() {
        isGameOver = true;
        clearTimeout(obstacleTimeout);
        myCatElement.querySelector('.emoji').textContent = '😵';
        document.getElementById('msg-title').textContent = "앗! 부딪혔다냥";
        msgContent.textContent = `최종 점수: ${score}`;
        restartBtn.textContent = "다시 시작";
        messageBox.style.display = 'block';
        syncMyState(0, false, true);
    }

    function createClouds() {
        for (let i = 0; i < 5; i++) {
            const cloud = document.createElement('div');
            cloud.classList.add('cloud');
            const size = Math.random() * 60 + 40;
            cloud.style.width = size + 'px';
            cloud.style.height = (size / 2) + 'px';
            cloud.style.top = Math.random() * 150 + 'px';
            cloud.style.right = -200 + 'px';
            cloud.style.animationDuration = (Math.random() * 15 + 15) + 's';
            container.appendChild(cloud);
        }
    }

    window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); } });
    container.addEventListener('mousedown', (e) => { if(e.button === 0) jump(); });
    container.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
    restartBtn.addEventListener('click', initGame);

    window.onload = () => {
        createClouds();
        startMultiplayer();
    };
</script>

</body>
</html>
